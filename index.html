<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bowl 49 Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff6e8;
      --panel: #ffffff;
      --ink: #3a1f1f;
      --accent: #c81d25; /* cherry red */
      --accent-2: #f4b400; /* golden yellow */
      --line: #ffe0b3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #ffe3e8 0 120px, transparent 121px),
        radial-gradient(circle at 90% 20%, #fff1cc 0 140px, transparent 141px),
        radial-gradient(circle at 20% 80%, #ffe3e8 0 130px, transparent 131px),
        var(--bg);
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .menu {
      width: min(820px, 100%);
      background: var(--panel);
      border: 4px solid var(--accent);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 14px 28px rgba(200,29,37,0.2);
      position: relative;
      overflow: hidden;
    }
    .menu::before,
    .menu::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffe3e8;
      opacity: 0.8;
      z-index: 0;
    }
    .menu::before { top: -40px; right: -40px; }
    .menu::after { bottom: -50px; left: -50px; background: #fff1cc; }
    .content { position: relative; z-index: 1; }
    h1 {
      margin: 0 0 6px;
      font-family: "Chewy", cursive;
      font-size: 40px;
      color: var(--accent);
      text-shadow: 2px 2px 0 #fff0c2;
      letter-spacing: 0.5px;
    }
    .sub {
      margin: 0 0 18px;
      color: #7a5a5a;
      font-size: 15px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ffe3e8;
      border: 1px solid var(--accent);
      font-size: 12px;
      margin-left: 6px;
    }
    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }
    .menu-image {
      width: 100%;
      height: auto;
      border-radius: 14px;
      border: 3px solid var(--accent-2);
      box-shadow: 0 12px 22px rgba(200,29,37,0.2);
      background: #fff;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #7a5a5a;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="menu" aria-label="Restaurant menu">
    <div class="content">
      <h1>Bowl 49</h1>
      <p class="sub">Menu <span class="badge">Scan & order</span></p>

      <div class="menu-stack">
        <img src="Page1.jpg" alt="Bowl 49 menu page 1" class="menu-image" />
        <img src="Page2.jpg" alt="Bowl 49 menu page 2" class="menu-image" />
      </div>

      <p class="footer">Prices subject to change.</p>
    </div>
  </main>
</body>
</html>
